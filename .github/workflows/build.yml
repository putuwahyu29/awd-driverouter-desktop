name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact_name: awd-driverouter-linux
          - os: windows-latest
            platform: windows/amd64
            artifact_name: awd-driverouter-windows
          - os: macos-latest
            platform: darwin/universal
            artifact_name: awd-driverouter-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config upx-ucl

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS & UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install nsis upx -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
          echo "C:\Program Files\NSIS" >> $GITHUB_PATH
          echo "C:\tools\nsis" >> $GITHUB_PATH
        shell: bash

      - name: Build Application
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            wails build -platform ${{ matrix.platform }} -nsis -upx -clean
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            wails build -platform ${{ matrix.platform }} -clean
          else
            wails build -platform ${{ matrix.platform }} -upx -clean
          fi
        shell: bash

      - name: Package macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r "awd-driverouter-macos-universal.zip" "Awd DriveRouter.app"
          rm -rf "Awd DriveRouter.app"
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/bin/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restructure and Rename Artifacts
        run: |
          mkdir release-dist
          VERSION="${{ github.ref_name }}"
          # Strip 'v' prefix if present for a cleaner filename, e.g. v1.1.0 -> 1.1.0
          VERSION_CLEAN="${VERSION#v}"
          
          # Linux
          if [ -f "artifacts/awd-driverouter-linux/Awd-DriveRouter" ]; then
            cp "artifacts/awd-driverouter-linux/Awd-DriveRouter" "release-dist/awd-driverouter-${VERSION_CLEAN}-linux-amd64"
          fi
          
          # Windows Executable
          if [ -f "artifacts/awd-driverouter-windows/Awd-DriveRouter.exe" ]; then
            cp "artifacts/awd-driverouter-windows/Awd-DriveRouter.exe" "release-dist/awd-driverouter-${VERSION_CLEAN}-windows-amd64.exe"
          fi
          
          # Windows Installer (Flexibly match any installer .exe)
          INSTALLER_FILE=$(find artifacts/awd-driverouter-windows -maxdepth 1 -name "*installer.exe" 2>/dev/null | head -n 1)
          if [ -n "$INSTALLER_FILE" ]; then
            cp "$INSTALLER_FILE" "release-dist/awd-driverouter-${VERSION_CLEAN}-windows-amd64-installer.exe"
          fi
          
          # macOS
          if [ -f "artifacts/awd-driverouter-macos/awd-driverouter-macos-universal.zip" ]; then
            cp "artifacts/awd-driverouter-macos/awd-driverouter-macos-universal.zip" "release-dist/awd-driverouter-${VERSION_CLEAN}-macos-universal.zip"
          fi
          
          ls -la release-dist
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
